name: Release (Windows)

# Push a tag such as v0.1.0 to build, test and attach an UNSIGNED portable ZIP + SHA-256 to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $name = "CmdPal-$v-win-x64-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/cmdpal.exe "dist/$name/CmdPal.exe"
          Copy-Item README.md, CHANGELOG.md "dist/$name/"
          "version: $v`ncommit: ${{ github.sha }}`ntype: portable ZIP, release build, UNSIGNED, static CRT, no .NET" | Set-Content "dist/$name/BUILD-INFO.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256"
      - name: Create GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --title "CmdPal ${{ github.ref_name }}" --notes-file CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/*.sha256
