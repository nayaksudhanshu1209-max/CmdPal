name: CI (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        shell: pwsh
        run: |
          rustup show
          cargo --version

      - name: Ensure lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) {
            Write-Warning "Cargo.lock missing: generating one. Download the 'Cargo.lock-generated' artifact and commit it."
            cargo generate-lockfile
          }

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

      - name: Release build (x64)
        run: cargo build --release

      - name: Package (portable ZIP, unsigned)
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $name = "CmdPal-$v-win-x64-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/cmdpal.exe "dist/$name/CmdPal.exe"
          Copy-Item README.md "dist/$name/README.md"
          @(
            "version: $v",
            "commit: ${{ github.sha }}",
            "run: ${{ github.run_number }}",
            "type: portable ZIP, release build, UNSIGNED, self-contained (static CRT, no .NET)"
          ) | Set-Content "dist/$name/BUILD-INFO.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256"
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.zip
            dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-generated
          path: Cargo.lock
